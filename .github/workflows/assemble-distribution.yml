name: Assemble uploaded distribution
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: u2a-macos-arm64
      ARCHIVE: DroneTrainer-macOS-AppleSilicon.zip
    steps:
      - name: Download uploaded parts
        timeout-minutes: 3
        run: timeout 170s gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE.part*" --dir parts
      - name: Restore and verify the original ZIP
        timeout-minutes: 3
        shell: python
        run: |
          import hashlib, os, pathlib, shutil, zipfile
          name = os.environ['ARCHIVE']
          parts = sorted(pathlib.Path('parts').glob(name + '.part*'))
          assert [p.name for p in parts] == [f'{name}.part{i:03d}' for i in range(39)], 'Missing or unexpected parts'
          with open(name, 'wb') as output:
              for part in parts:
                  with part.open('rb') as source:
                      shutil.copyfileobj(source, output)
          assert pathlib.Path(name).stat().st_size == 652920780
          with open(name, 'rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          assert digest == '28852f5325e92c08c0a9c18df605ffa558e7915c8b39d1796dbd66f6cfe7f07d', digest
          with zipfile.ZipFile(name) as archive:
              assert archive.testzip() is None
          print('Original archive size, SHA-256 and ZIP CRC verified')
      - name: Upload the complete distribution
        timeout-minutes: 3
        run: timeout 170s gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
      - name: Verify GitHub stored the correct file
        timeout-minutes: 1
        shell: python
        run: |
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["TAG"]}'], timeout=30))
          asset = next(a for a in release['assets'] if a['name'] == os.environ['ARCHIVE'])
          assert asset['state'] == 'uploaded' and asset['size'] == 652920780
          assert asset['digest'] == 'sha256:28852f5325e92c08c0a9c18df605ffa558e7915c8b39d1796dbd66f6cfe7f07d'
          print(asset['browser_download_url'])
      - name: Remove transfer parts
        timeout-minutes: 3
        run: |
          for part in parts/*; do
            gh release delete-asset "$TAG" "$(basename "$part")" --repo "$GITHUB_REPOSITORY" --yes
          done
      - name: Publish the verified distribution
        timeout-minutes: 1
        run: timeout 30s gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
